<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Formulario Vehículo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/formularioVehiculo.css">
    <link rel="stylesheet" href="../../css/mensajes.css">
</head>

<body>

      <!-- Contenedor principal del formulario de vehículo -->
    <div class="container mt-5 mb-5 formulario-container">

        <h1 class="mb-4 text-center">Formulario Vehículo</h1>

           <!-- Contenedor para mostrar mensajes de error o éxito -->
        <div id="mensaje-form-vehiculo" class="text-center mb-3"></div>

        <!-- Formulario para ingresar los datos del vehículo -->
        <form id="formVehiculo" enctype="multipart/form-data">
            <input type="hidden" id="vehiculoId">

            <div class="mb-3">
                <input type="text" id="marca" placeholder="Marca" class="form-control" required>
            </div>

            <div class="mb-3">
                <input type="text" id="modelo" placeholder="Modelo" class="form-control" required>
            </div>

            <div class="mb-3">
                <input type="number" id="anno" placeholder="Año" min="1886" max="2026" class="form-control" required>
            </div>

            <div class="mb-3">
                <input type="number" id="precio" placeholder="Precio" min="0" class="form-control" required>
            </div>

            <select id="combustible" class="form-control" required>
                <option value="">Seleccione combustible</option>
                <option value="Gas">Gas</option>
                <option value="Disel">Disel</option>
                <option value="Gasolina">Gasolina</option>
            </select><br>

            <div class="mb-3">
                <input type="text" id="color" placeholder="Color" class="form-control" required>
            </div>

            <div class="mb-3">
                <select id="transmision" class="form-control" required>
                    <option value="">Seleccione transmision</option>
                    <option value="Manual">Manual</option>
                    <option value="Automatico">Automatico</option>
                </select>
            </div>

            <div class="mb-3">
                <select id="condicion" class="form-control" required>
                    <option value="">Seleccione la condición de su auto</option>
                    <option value="Usado">Usado</option>
                    <option value="Nuevo">Nuevo</option>
                </select>
            </div>

            <div class="mb-3">
                <input type="file" id="imagen" name="imagen" accept="image/*" class="form-control">
                <img id="vistaPrevia" class="img-fluid mt-3 rounded shadow" style="max-height: 200px; display: none;">
            </div>

            <div class="d-flex justify-content-end gap-3 mt-4">
                <button type="button" class="btn btn-guardar px-4" onclick="guardarVehiculo()">
                    Guardar
                </button>
                <button type="button" class="btn btn-regresar px-4" onclick="regresar()">
                    Regresar
                </button>
            </div>

        </form>

    </div>

    <script src="../../js/utilidades/mensajes.js"></script>
    <script src="../../js/vehiculo/configuracion.js"></script>
    <script src="../../js/vehiculo/formularioVehiculo.js"></script>
</body>

</html>
