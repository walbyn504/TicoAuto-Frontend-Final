<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detalles del Vehículo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/detalleVehiculo.css">
    <link rel="stylesheet" href="/css/mensajes.css">
    <link rel="stylesheet" href="/css/filtroVehiculos.css">
</head>

<body>

    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
        <!-- Menú de opciones en la barra de navegación -->
        <div id="menuOpciones"></div>

        <!-- Título de la página -->
        <div class="titulo-centro" id="tituloNavbar">
            TicoAuto
        </div>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Contenido del menú de navegación -->
        <div class="collapse navbar-collapse" id="menuNav">
            <div class="ms-auto d-flex align-items-center">
                <!-- Nombre del usuario conectado -->
                <span class="text-white fs-5 me-3" id="nombreUsuario"></span>
                <!-- Botones de usuario (ej. iniciar sesión, cerrar sesión) -->
                <div id="botonesUsuario"></div>
            </div>
        </div>
    </nav>

     <!-- Contenedor principal de la página -->
    <div class="container py-4">
        <!-- Mensajes de detalles de vehículos (ej. errores, notificaciones) -->
        <div id="mensaje-detalle-vehiculo" class="text-center mb-3"></div>
        <!-- Contenedor donde se mostrarán los detalles del vehículo -->
        <div id="vehiculoDetalles"></div>
    </div>

    <script src="/js/utilidades/mensajes.js"></script>
    <script src="/js/vehiculo/configuracion.js"></script>
    <script src="/js/vehiculo/verificarUsuario.js"></script>
    <script src="/js/vehiculo/verInfoVehiculo.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
