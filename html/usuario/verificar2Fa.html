<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Verificación 2FA</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/mensajes.css">
</head>

<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="card p-4 shadow position-relative" style="width: 380px;">

        <!-- ❌ BOTÓN CERRAR -->
        <button onclick="cerrar2FA()" class="btn btn-sm btn-light position-absolute top-0 end-0 m-2"
            style="border-radius:50%; width:32px; height:32px;">
            ✕
        </button>

        <h3 class="text-center mb-3">Verificación</h3>
        <p class="text-muted text-center">Ingresa el código enviado a tu teléfono</p>

        <div id="contenedor-mensajes"></div>

        <input type="text" id="codigo" class="form-control mb-3" placeholder="Código de 6 dígitos" maxlength="6">

        <p class="text-center text-danger mb-3" id="contadorTiempo">
            El código expira en: 01:00
        </p>

        <button id="btnVerificar" class="btn btn-primary w-100" onclick="verificarCodigo()">
            Verificar
        </button>

        <div id="accionesExpirado" class="mt-3 d-none">
            <button class="btn btn-outline-secondary w-100" onclick="cerrar2FA()">
                Volver a iniciar sesión
            </button>
        </div>
    </div>

    <script src="../../js/utilidades/mensajes.js"></script>
    <script src="../../js/usuario/verificar2FA.js"></script>

</body>

</html>
