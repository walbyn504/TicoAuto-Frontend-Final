<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Registro de Usuario</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/registro.css">
    <link rel="stylesheet" href="../../css/mensajes.css">
</head>

<body>

    <div class="panel-formulario">
        <div class="card-neon">

            <h1 class="titulo-formulario mb-4">Registro de Usuario</h1>

            <div id="contenedor-mensajes"></div>

            <div class="d-flex gap-2 mb-3">
                <input type="text" id="cedula" class="form-control" placeholder="Cédula (Eje: 201110222)">

                <button type="button" onclick="consultarCedula()" class="btn boton-neon btn-sm px-3">
                    Consultar
                </button>
            </div>

            <input type="text" id="nombre" class="form-control mb-3" placeholder="Nombre" readonly>
            <input type="text" id="primerApellido" class="form-control mb-3" placeholder="Primer apellido" readonly>
            <input type="text" id="segundoApellido" class="form-control mb-3" placeholder="Segundo apellido" readonly>

            <input type="text" id="telefono" class="form-control mb-3" placeholder="Teléfono (Eje: 88889999)">
            <input type="email" id="correo" class="form-control mb-3" placeholder="Correo">
            <input type="password" id="contrasenna" class="form-control mb-3" placeholder="Contraseña">

            <div class="d-grid gap-2">
                <button type="button" onclick="registrarUsuario()" class="btn boton-neon">  
                    Registrar
                </button>
            </div>

            <div class="text-center mt-3">
                <a href="inicioSesion.html" class="link-iniciar">
                    ¿Ya tienes cuenta? Inicia sesión
                </a>
            </div>

        </div>
    </div>

    <script src="../../js/utilidades/mensajes.js" defer></script>
    <script src="../../js/usuario/registro.js" defer></script>

</body>

</html>
