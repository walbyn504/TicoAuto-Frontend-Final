<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Registro de Usuario</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/registro.css">
    <link rel="stylesheet" href="../../css/mensajes.css">

    <!-- Google Identity Services (para autenticación con Google) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://cdn.jsdelivr.net/npm/jwt-decode@3.1.2/build/jwt-decode.min.js"></script>
</head>

<body>

      <!-- Contenedor principal del formulario de registro -->
    <div class="panel-formulario">
        <div class="card-neon">

            <!-- Título de la página de registro -->
            <h1 class="titulo-formulario mb-4">Registro de Usuario</h1>

            <!-- Contenedor para mensajes de error o éxito -->
            <div id="contenedor-mensajes"></div>

            <!-- Campo oculto para modo Google (para saber si se está usando Google para registrarse) -->
            <input type="hidden" id="modoGoogle" value="false">

             <!-- Input de cédula con un botón para consultar la cédula -->
            <div class="d-flex gap-2 mb-3">
                <input type="text" id="cedula" class="form-control" placeholder="Cédula (Eje: 201110222)">

                <button type="button" onclick="consultarCedula()" class="btn boton-neon btn-sm px-3">
                    Consultar
                </button>
            </div>

                <!-- Campos de texto para nombre y apellidos, solo lectura -->
            <input type="text" id="nombre" class="form-control mb-3" placeholder="Nombre" readonly>
            <input type="text" id="primerApellido" class="form-control mb-3" placeholder="Primer apellido" readonly>
            <input type="text" id="segundoApellido" class="form-control mb-3" placeholder="Segundo apellido" readonly>

            <input type="number" id="telefono" class="form-control mb-3" placeholder="Teléfono (Eje: 88889999)">

            <div id="bloqueCredenciales">
                <input type="email" id="correo" class="form-control mb-3" placeholder="Correo">
                <input type="password" id="contrasenna" class="form-control mb-3" placeholder="Contraseña">
            </div>

            <div class="d-grid gap-2 mb-3">
                <button type="button" onclick="registrarUsuario()" class="btn boton-neon">
                    Registrar
                </button>
            </div>

            <div class="text-center mb-2">
                <small class="text-light">
                    O bien regístrate con Google
                </small>
            </div>

            <!--Boton Google-->
            <div class="text-center mb-3">
                <div id="g_id_onload"
                    data-client_id="817077174471-bt5e6bh7eelg0989ksook2k9m1eu9tbp.apps.googleusercontent.com"
                    data-callback="handleGoogleRegisterResponse" data-auto_prompt="false">
                </div>

                <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline"
                    data-text="signup_with" data-shape="rectangular" data-logo_alignment="left">
                </div>
            </div>

            <div class="text-center mt-3">
                <a href="inicioSesion.html" class="link-iniciar">
                    ¿Ya tienes cuenta? Inicia sesión
                </a>
            </div>

        </div>
    </div>

    <script src="../../js/utilidades/mensajes.js" defer></script>
    <script src="../../js/usuario/registro.js" defer></script>

</body>

</html>
