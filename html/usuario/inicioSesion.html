<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Inicio de Sesión</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../css/inicioSesion.css">
    <link rel="stylesheet" href="../../css/mensajes.css">

    <!-- Google Identity Services (Autenticación con Google) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

</head>

<body>

    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg px-3">
        <div class="ms-auto d-flex gap-2 me-3">
            <a href="/index.html" class="btn btn-outline-light">
                <i class="bi bi-house fs-5"></i>
            </a>
        </div>
    </nav>

    <!-- Contenedor de inicio de sesión-->
    <div class="contenedor-login">

        <div class="card-login">

            <!-- Título de la página de inicio sesión -->
            <h2 class="titulo-login mb-4 text-center">Iniciar Sesión</h2>

            <!-- Contenedor para mensajes de error o éxito-->
            <div id="contenedor-mensajes"></div>

            <input type="email" id="correo" class="form-control input-auto mb-3" placeholder="Correo Electrónico">

            <input type="password" id="contrasenna" class="form-control input-auto mb-3" placeholder="Contraseña"
                autocomplete="new-password">

            <!-- Botón para inicio sesión -->
            <div class="d-grid gap-2 mb-3">
                <button onclick="iniciarSesion()" class="btn btn-auto">
                    Ingresar
                </button>
            </div>

            <!-- BOTÓN GOOGLE -->
            <div class="text-center mb-3">
                <div id="g_id_onload"
                    data-client_id="817077174471-bt5e6bh7eelg0989ksook2k9m1eu9tbp.apps.googleusercontent.com"
                    data-callback="handleGoogleLoginResponse" data-auto_prompt="false">
                    <!-- Función que obtiene credenciales -->
                </div>

                <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline"
                    data-text="signin_with" data-shape="rectangular" data-logo_alignment="left">
                </div>
            </div>

            <div class="text-center">
                <a href="registro.html" class="link-crear">
                    ¿No tienes cuenta? Regístrate
                </a>
            </div>

        </div>

    </div>

    <script src="../../js/usuario/inicioSesion.js" defer></script>
    <script src="../../js/utilidades/mensajes.js" defer></script>

</body>

</html>
